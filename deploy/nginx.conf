# 컨테이너에 마운트하는 nginx 설정.
#   /opt/midpoint/main/nginx.conf    -> main-web    컨테이너
#   /opt/midpoint/develop/nginx.conf -> develop-web 컨테이너
# 마운트 위치는 /etc/nginx/conf.d/default.conf 다.
#
# TLS 는 앞단 ALB 가 끊는다. 그래서 여기는 평문 80 만 듣고 인증서를 다루지 않는다.

server {
  listen 80;
  server_name _;

  root /usr/share/nginx/html;
  index index.html;

  # 해시가 붙은 빌드 산출물. 내용이 바뀌면 파일명이 바뀌므로 영구 캐시해도 안전하다.
  #
  # try_files 의 =404 가 핵심이다. 이게 없으면 아래 SPA fallback 이 걸려서
  # 사라진 해시 파일 요청에 index.html 이 .js MIME 으로 내려간다.
  # 브라우저는 "Unexpected token '<'" 로 죽고, 원인이 네트워크 탭에만 보인다.
  # 배포 직후 이전 페이지를 열어둔 사용자가 정확히 이 경우에 걸린다.
  location ^~ /assets/ {
    try_files $uri =404;
    add_header Cache-Control "public, max-age=31536000, immutable";
  }

  # index.html 은 절대 캐시하지 않는다. 이게 캐시되면 새 배포를 해도
  # 브라우저가 옛 해시 파일 이름을 계속 요청한다.
  location = /index.html {
    add_header Cache-Control "no-cache, must-revalidate";
  }

  # SPA fallback. /join/:roomUuid 같은 초대 링크로 바로 들어와도
  # 라우터가 처리할 수 있게 index.html 을 준다.
  location / {
    try_files $uri $uri/ /index.html;
  }
}
