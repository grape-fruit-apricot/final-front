name: 프론트 배포

on:
  push:
    # 태그 push 에서는 돌지 않게 브랜치를 명시한다.
    # (github.ref_name 은 태그에서도 값이 들어와서, 제한이 없으면 태그 하나에 dev 로 배포된다)
    branches: [develop, main]
  # 롤백·재배포용. 이전 커밋을 골라 다시 돌리면 그 버전이 배포된다.
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # 배포 도중 취소되면 서버 dist 가 반쪽만 갈아끼워진 상태로 남는다.
  group: frontend-deploy-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  deploy:
    name: 빌드 후 배포
    runs-on: ubuntu-latest
    environment: ${{ github.ref_name == 'main' && 'production' || 'develop' }}

    steps:
      - uses: actions/checkout@v4
        with:
          # 기본값은 GITHUB_TOKEN 을 .git/config 에 남긴다. 빌드가 읽을 수 있으므로 끈다.
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      # 이 스텝이 없으면 값이 비어도 vite build 는 그냥 성공한다.
      # 빈 값이면 axios baseURL 이 undefined 가 되어 API 호출이 자기 자신(web 컨테이너)으로
      # 가서 전부 404 가 되고, SockJS 주소는 "undefined/ws" 가 된다.
      # 둘 다 브라우저 콘솔에서만 보이는 증상이라 배포 전에 여기서 잡는다.
      - name: 환경변수 가드
        env:
          VITE_API_BASE_URL: ${{ vars.VITE_API_BASE_URL }}
          VITE_KAKAO_JS_KEY: ${{ secrets.VITE_KAKAO_JS_KEY }}
        run: |
          fail=0
          if [ -z "$VITE_API_BASE_URL" ]; then
            echo "::error::VITE_API_BASE_URL 이 비어 있습니다 (Environment Variables 확인)"; fail=1
          elif [ "${VITE_API_BASE_URL%/}" != "$VITE_API_BASE_URL" ]; then
            echo "::error::VITE_API_BASE_URL 끝의 / 를 빼세요. useRoomSocket 이 \${BASE}/ws 로 이어붙여 //ws 가 됩니다"; fail=1
          elif [ "${VITE_API_BASE_URL#https://}" = "$VITE_API_BASE_URL" ]; then
            echo "::error::VITE_API_BASE_URL 은 https:// 여야 합니다. 페이지가 https 라 http 호출은 혼합콘텐츠로 차단됩니다"; fail=1
          fi
          if [ -z "$VITE_KAKAO_JS_KEY" ]; then
            echo "::error::VITE_KAKAO_JS_KEY 가 비어 있습니다 (Environment Secrets 확인)"; fail=1
          fi
          exit $fail

      - run: npm ci

      - run: npm run lint

      - name: 빌드
        env:
          VITE_API_BASE_URL: ${{ vars.VITE_API_BASE_URL }}
          VITE_KAKAO_JS_KEY: ${{ secrets.VITE_KAKAO_JS_KEY }}
        run: npm run build

      - name: 압축
        # -C dist . 형태여야 한다. dist/ 를 그대로 넣으면 경로가 한 단계 깊어지고,
        # dist/* 로 넣으면 점으로 시작하는 파일을 놓친다.
        run: tar -czf dist.tar.gz -C dist .

      - name: SSH 키 준비
        run: |
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          printf '%s\n' "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          printf '%s\n' "${{ vars.SSH_KNOWN_HOSTS }}" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      - name: 서버로 전송
        env:
          DEPLOY_ENV: ${{ vars.DEPLOY_ENV }}
        run: |
          scp -i ~/.ssh/deploy_key -o IdentitiesOnly=yes \
            dist.tar.gz deploy/web-deploy.sh \
            "${{ vars.DEPLOY_USER }}@${{ vars.DEPLOY_HOST }}:/opt/midpoint/${DEPLOY_ENV}/incoming/"

      - name: 배포 실행
        run: |
          ssh -i ~/.ssh/deploy_key -o IdentitiesOnly=yes \
            "${{ vars.DEPLOY_USER }}@${{ vars.DEPLOY_HOST }}" \
            "bash /opt/midpoint/${{ vars.DEPLOY_ENV }}/incoming/web-deploy.sh ${{ vars.DEPLOY_ENV }} ${{ github.sha }}"
